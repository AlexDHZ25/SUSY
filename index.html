<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería Privada | SUSY</title>

    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1hpQGY_QfG4VAE4g8VJRTAYAXUWE-XtOB&sz=w32">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="header-galeria">
      <div class="titulo">SUSY</div>
      <div class="subtitulo">MIS XV</div>
      <img src="https://drive.google.com/thumbnail?id=1hpQGY_QfG4VAE4g8VJRTAYAXUWE-XtOB&sz=w200" class="logo-header" alt="Logo Agency">
    </div>

    <div class="barra-acciones" id="barra-acciones" style="display: none;">
      <button id="btn-descargar-todo" class="btn-accion">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Descargar Galería
      </button>
      <button id="btn-ver-favoritos" class="btn-accion">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        Ver Favoritos
      </button>
    </div>

    <div id="cargando-texto" class="cargando">⏳ Preparando recuerdos...</div>
    <div class="grid-galeria" id="contenedor-galeria"></div>

    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>

    <script>
      const contenedor = document.getElementById("contenedor-galeria");
      const cargandoTexto = document.getElementById("cargando-texto");
      const barraAcciones = document.getElementById("barra-acciones");
      const btnVerFavoritos = document.getElementById("btn-ver-favoritos");
      const btnDescargarTodo = document.getElementById("btn-descargar-todo");

      const CLAVE_FAVORITOS = "favoritos_susy";

      let todasLasFotos = [];
      let mostrandoFavoritos = false;
      let lightboxInstancia = null;
      let listaActual = []; 
      let indiceActual = 0;
      const FOTOS_POR_LOTE = 15; 
      let columnasGlobales = [];

      // 1. CARGA DE DATOS
      fetch('fotos.json')
        .then((response) => response.json())
        .then((fotos) => {
          cargandoTexto.style.display = "none";
          if (!fotos || fotos.length === 0) return;

          // ORDEN INVERSO (Lo más nuevo primero)
          todasLasFotos = fotos.reverse(); 
          
          barraAcciones.style.display = "flex"; 
          iniciarGaleria(todasLasFotos); 
        })
        .catch((error) => {
          cargandoTexto.innerText = "❌ Error al cargar fotos.json";
        });

      // 2. INICIALIZAR GRILLA MASONRY
      function iniciarGaleria(listaFotos) {
        contenedor.innerHTML = ""; 
        listaActual = listaFotos;
        indiceActual = 0;

        let numColumnas = window.innerWidth > 768 ? 3 : 2;
        columnasGlobales = [];

        for (let i = 0; i < numColumnas; i++) {
          let col = document.createElement("div");
          col.className = "columna-masonry";
          contenedor.appendChild(col);
          columnasGlobales.push(col);
        }

        if (lightboxInstancia) lightboxInstancia.destroy();
        cargarSiguienteLote();
      }

      // 3. CARGA PROGRESIVA (Lazy Load)
      function cargarSiguienteLote() {
        let fragmento = listaActual.slice(indiceActual, indiceActual + FOTOS_POR_LOTE);
        if (fragmento.length === 0) return; 

        let numColumnas = columnasGlobales.length;

        fragmento.forEach((foto, i) => {
          let globalIndex = indiceActual + i;
          const miniatura = `https://drive.google.com/thumbnail?id=${foto.id}&sz=w400`;
          const altaRes = `https://drive.google.com/thumbnail?id=${foto.id}&sz=w1600`;

          const enlace = document.createElement("a");
          enlace.href = altaRes;
          enlace.className = "foto-link glightbox";
          enlace.setAttribute("data-id", foto.id);

          const img = document.createElement("img");
          img.src = miniatura;
          img.className = "foto-img";
          img.loading = "lazy";
          
          enlace.appendChild(img);
          columnasGlobales[globalIndex % numColumnas].appendChild(enlace);
        });

        indiceActual += FOTOS_POR_LOTE;
        actualizarLightbox();
      }

      // 4. SCROLL INFINITO
      window.addEventListener('scroll', () => {
          if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
              if (indiceActual < listaActual.length) cargarSiguienteLote();
          }
      });

      // 5. VISOR DE FOTOS (LIGHTBOX)
      function actualizarLightbox() {
          if (!lightboxInstancia) {
              lightboxInstancia = GLightbox({ touchNavigation: true, loop: true });
          } else {
              lightboxInstancia.reload();
          }
      }

      // 6. BOTONES GLOBALES
      btnVerFavoritos.onclick = () => {
        if (!mostrandoFavoritos) {
          let misFavs = JSON.parse(localStorage.getItem(CLAVE_FAVORITOS)) || [];
          if (misFavs.length === 0) { alert("No tienes favoritos aún"); return; }
          let filtradas = todasLasFotos.filter(f => misFavs.includes(f.id));
          mostrandoFavoritos = true;
          btnVerFavoritos.innerText = "⬅ Ver Todas";
          iniciarGaleria(filtradas);
        } else {
          mostrandoFavoritos = false;
          btnVerFavoritos.innerText = "Ver Favoritos";
          iniciarGaleria(todasLasFotos);
        }
      };

      btnDescargarTodo.onclick = () => {
        const ID_ZIP = "TU_ID_AQUI"; 
        window.open(`https://drive.google.com/uc?export=download&id=${ID_ZIP}`, "_blank");
      };
    </script>
</body>
</html>
